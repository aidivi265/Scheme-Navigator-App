services:
  - type: web
    name: schemenavigator-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://aidivi265.github.io,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: schemenavigator-db
          property: connectionString

databases:
  - name: schemenavigator-db
    plan: free
    ipAllowList: []
