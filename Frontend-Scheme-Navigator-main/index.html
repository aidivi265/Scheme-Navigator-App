    <!-- Schema.org JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SchemeNavigator",
        "url": "https://aidivi265.github.io/Scheme-Navigator-App/",

    <!-- Immediate theme initialization script to avoid white flash on reload -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('scheme_navigator_theme');
          if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts -->
